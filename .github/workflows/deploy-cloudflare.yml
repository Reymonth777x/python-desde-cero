name: Deploy Cloudflare Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-desde-cero-cloudflare-production
  cancel-in-progress: false

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Comprobar disponibilidad de credenciales (sin imprimir valores)
        id: check
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/master" && -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales de despliegue disponibles; se ejecutará el build y deploy."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Despliegue omitido. Confirma que el workflow corre en master y configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en GitHub Actions Secrets."
          fi

  deploy:
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: Configurar entorno público de producción
        run: echo "Usando configuración pública de Supabase para el Worker."
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nuqydanbbgqcofcftshk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m2uv5ltBuTN1UQyo5meB-A_zoWCR-x6
          NEXT_PUBLIC_SITE_URL: https://python-desde-cero.pythondesdecero.workers.dev

      - name: Diagnosticar token y acceso a cuenta (sin revelar secretos)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="$RAW_CF_ACCOUNT"
          account_id="${account_id#"${account_id%%[![:space:]]*}"}"
          account_id="${account_id%"${account_id##*[![:space:]]}"}"
          if [[ ! "$account_id" =~ ^[A-Za-z0-9_-]{16,64}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID no tiene un formato válido. Copia solo el identificador de tu cuenta."
            exit 1
          fi
          verify_json="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          verify_ok="$(jq -r '.success // false' <<< "$verify_json")"
          if [[ "$verify_ok" != "true" ]]; then
            codes="$(jq -r '[.errors[]?.code] | join(",")' <<< "$verify_json")"
            echo "::error::Cloudflare rechazó el API token (códigos: ${codes:-sin código}). Crea un token nuevo con permisos de Workers Scripts:Edit y Account Settings:Read."
            exit 1
          fi
          echo "El token de Cloudflare está activo."
          account_json="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id")"
          account_ok="$(jq -r '.success // false' <<< "$account_json")"
          if [[ "$account_ok" != "true" ]]; then
            codes="$(jq -r '[.errors[]?.code] | join(",")' <<< "$account_json")"
            echo "::error::El token no puede consultar la cuenta indicada o el Account ID no coincide (códigos: ${codes:-sin código}). Revisa el acceso a la cuenta y Account ID."
            exit 1
          fi
          echo "Token activo y cuenta accesible; credenciales no mostradas."

      - name: Compilar para Cloudflare Workers
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nuqydanbbgqcofcftshk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m2uv5ltBuTN1UQyo5meB-A_zoWCR-x6
          NEXT_PUBLIC_SITE_URL: https://python-desde-cero.pythondesdecero.workers.dev

      - name: Normalizar y validar Account ID sin exponerlo
        shell: bash
        env:
          RAW_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account_id="$RAW_CF_ACCOUNT_ID"
          account_id="${account_id#"${account_id%%[![:space:]]*}"}"
          account_id="${account_id%"${account_id##*[![:space:]]}"}"
          if [[ ! "$account_id" =~ ^[A-Za-z0-9_-]{16,64}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID no tiene formato válido. Copia únicamente el Account ID de Cloudflare, sin comillas ni espacios."
            exit 1
          fi
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          echo "Account ID validado; el valor permanece oculto."

      - name: Desplegar Worker
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://nuqydanbbgqcofcftshk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m2uv5ltBuTN1UQyo5meB-A_zoWCR-x6
          NEXT_PUBLIC_SITE_URL: https://python-desde-cero.pythondesdecero.workers.dev

      - name: Comprobar la web publicada
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors \
            https://python-desde-cero.pythondesdecero.workers.dev/ -o /tmp/python-desde-cero-home.html
          grep -qi "Python desde cero" /tmp/python-desde-cero-home.html
          echo "La página pública respondió y contiene el título esperado."
