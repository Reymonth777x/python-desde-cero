name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: python-desde-cero-cloudflare-production
  cancel-in-progress: false

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      site_key: ${{ steps.check.outputs.site_key }}
    steps:
      - name: Comprobar disponibilidad de credenciales (sin imprimir valores)
        id: check
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" || "$WORKFLOW_HEAD_BRANCH" != "master" || "$WORKFLOW_CONCLUSION" != "success" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Despliegue omitido: solo se publica el SHA de master tras CI exitoso."
            exit 0
          fi

          site_key="$(printf '%s' "$RAW_TURNSTILE_SITE_KEY" | tr -d '[:space:]')"
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Despliegue omitido. Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en GitHub Actions Secrets."
            exit 0
          fi

          is_real_site_key() {
            local candidate="$1"
            [[ "$candidate" =~ ^[A-Za-z0-9_-]{20,128}$ ]] &&
              [[ "$candidate" != "1x00000000000000000000AA" ]] &&
              [[ "$candidate" != "2x00000000000000000000AB" ]] &&
              [[ "$candidate" != "1x00000000000000000000BB" ]] &&
              [[ "$candidate" != "2x00000000000000000000BB" ]] &&
              [[ "$candidate" != "3x00000000000000000000FF" ]]
          }

          # If the public key was not configured in GitHub Actions, make a
          # read-only lookup. Only use a single widget explicitly allowlisting
          # the production hostname; never guess between multiple candidates.
          if ! is_real_site_key "$site_key"; then
            echo "::notice::No hay una Sitekey real configurada; buscando un widget Turnstile existente para python-desdecero.com."
            if widgets_json="$(curl --fail --silent --show-error               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets?per_page=1000" 2>/dev/null)"; then
              list_ok="$(jq -r '.success // false' <<< "$widgets_json")"
              total_count="$(jq -r '.result_info.total_count // (.result | length) // 0' <<< "$widgets_json")"
              if [[ "$list_ok" == "true" && "$total_count" -le 1000 ]]; then
                matching_keys="$(jq -r '[.result[]? | select((.domains // []) | index("python-desdecero.com")) | .sitekey] | unique | .[]' <<< "$widgets_json")"
                if [[ -n "$matching_keys" && "$(printf '%s\n' "$matching_keys" | wc -l | tr -d ' ')" == "1" ]]; then
                  site_key="$matching_keys"
                  echo "Se encontró exactamente un widget Turnstile con el hostname de producción permitido."
                elif [[ -z "$matching_keys" ]]; then
                  echo "::notice::Cloudflare no devolvió un widget que permita exactamente python-desdecero.com."
                else
                  echo "::warning::Hay varios widgets Turnstile para python-desdecero.com; no se seleccionará ninguno automáticamente."
                fi
              else
                echo "::notice::No se pudo verificar una lista completa de widgets Turnstile con el permiso actual."
              fi
            else
              echo "::notice::El API token actual no permite consultar widgets Turnstile; configura NEXT_PUBLIC_TURNSTILE_SITE_KEY en GitHub Actions Variables."
            fi
          fi

          if ! is_real_site_key "$site_key"; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Despliegue omitido: no se encontró una Sitekey real única para python-desdecero.com. Define NEXT_PUBLIC_TURNSTILE_SITE_KEY en GitHub Actions Variables. No uses llaves de prueba."
            exit 0
          fi

          # A Turnstile sitekey is public and is required by the browser build.
          # Never read, print, or export the widget's private secret here.
          echo "site_key=$site_key" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "CI correcto; credenciales y una Sitekey pública válida están disponibles (valores ocultos)."

  deploy:
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: Configurar entorno público de producción
        run: echo "Usando configuración pública de Supabase para el Worker."
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nuqydanbbgqcofcftshk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m2uv5ltBuTN1UQyo5meB-A_zoWCR-x6
          NEXT_PUBLIC_SITE_URL: https://python-desdecero.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ needs.check-credentials.outputs.site_key }}

      - name: Diagnosticar y normalizar credenciales de Cloudflare sin revelarlas
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$RAW_CF_TOKEN"
          token="${token#"${token%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"
          # Accept a token copied with a wrapper/prefix, but never print it.
          for _ in 1 2; do
            if [[ "$token" == \"*\" && "${#token}" -ge 2 ]]; then
              token="${token:1:${#token}-2}"
            elif [[ "$token" == \'*\' && "${#token}" -ge 2 ]]; then
              token="${token:1:${#token}-2}"
            fi
            case "${token,,}" in
              "bearer "*) token="${token:7}" ;;
              "bearer:"*) token="${token#*:}" ;;
              "cloudflare_api_token="*) token="${token#*=}" ;;
            esac
          done
          token="$(printf '%s' "$token" | tr -d '[:space:]')"
          if [[ -z "$token" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN está vacío."
            exit 1
          fi

          account_id="$RAW_CF_ACCOUNT"
          account_id="${account_id#"${account_id%%[![:space:]]*}"}"
          account_id="${account_id%"${account_id##*[![:space:]]}"}"
          if [[ ! "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID debe tener exactamente 32 caracteres hexadecimales. Cópialo desde la página principal de Cloudflare."
            exit 1
          fi

          # This credential was created under Account API tokens, so verify it
          # using the account-scoped endpoint, not the user-token endpoint.
          verify_json="$(curl --silent --show-error \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens/verify")"
          verify_ok="$(jq -r '.success // false' <<< "$verify_json")"
          if [[ "$verify_ok" != "true" ]]; then
            codes="$(jq -r '[.. | objects | .code? | select(. != null)] | unique | join(",")' <<< "$verify_json")"
            messages="$(jq -r '[.. | objects | .message? | select(. != null)] | unique | join("; ")' <<< "$verify_json" | tr -d '\r\n')"
            echo "::error::Cloudflare rechazó el API token (códigos: ${codes:-sin código}). Detalle: ${messages:-sin detalle}. Asegúrate de usar un API Token, no la Global API Key, y guarda solo el valor del token."
            exit 1
          fi
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "Token de Cloudflare validado (longitud comprobada; valor oculto)."

          account_json="$(curl --silent --show-error \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id")"
          account_ok="$(jq -r '.success // false' <<< "$account_json")"
          if [[ "$account_ok" != "true" ]]; then
            codes="$(jq -r '[.. | objects | .code? | select(. != null)] | unique | join(",")' <<< "$account_json")"
            messages="$(jq -r '[.. | objects | .message? | select(. != null)] | unique | join("; ")' <<< "$account_json" | tr -d '\r\n')"
            echo "::error::Cloudflare no acepta el Account ID o el token no tiene lectura de cuenta. Códigos: ${codes:-sin código}. Detalle: ${messages:-sin detalle}. Verifica Account ID y permisos Account Settings:Read."
            exit 1
          fi
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          echo "Cuenta accesible; credenciales no mostradas."

      - name: Compilar para Cloudflare Workers
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nuqydanbbgqcofcftshk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m2uv5ltBuTN1UQyo5meB-A_zoWCR-x6
          NEXT_PUBLIC_SITE_URL: https://python-desdecero.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ needs.check-credentials.outputs.site_key }}

      - name: Normalizar y validar Account ID sin exponerlo
        shell: bash
        env:
          RAW_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account_id="$RAW_CF_ACCOUNT_ID"
          account_id="${account_id#"${account_id%%[![:space:]]*}"}"
          account_id="${account_id%"${account_id##*[![:space:]]}"}"
          if [[ ! "$account_id" =~ ^[A-Za-z0-9_-]{16,64}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID no tiene formato válido. Copia únicamente el Account ID de Cloudflare, sin comillas ni espacios."
            exit 1
          fi
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          echo "Account ID validado; el valor permanece oculto."

      - name: Desplegar Worker
        run: npm run deploy:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nuqydanbbgqcofcftshk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m2uv5ltBuTN1UQyo5meB-A_zoWCR-x6
          NEXT_PUBLIC_SITE_URL: https://python-desdecero.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ needs.check-credentials.outputs.site_key }}

      - name: Verificar dominio personalizado conectado al Worker
        shell: bash
        run: |
          set -euo pipefail
          domains_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=python-desdecero.com")"
          worker_service="$(jq -r '[.result[] | select(.hostname == "python-desdecero.com" and .enabled == true)][0].service // empty' <<< "$domains_json")"
          if [[ "$worker_service" != "python-desdecero" ]]; then
            echo "::error::El dominio personalizado no está conectado al Worker python-desdecero. Servicio detectado: ${worker_service:-ninguno}."
            exit 1
          fi
          echo "Dominio personalizado verificado: python-desdecero.com -> python-desdecero."

      - name: Comprobar la versión nueva en la web publicada
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors \
            "https://python-desdecero.com/?release=$GITHUB_SHA" -o /tmp/python-desde-cero-home.html
          grep -Fqi "Entiende lo que haces" /tmp/python-desde-cero-home.html
          grep -Fqi "Cuatro módulos principales" /tmp/python-desde-cero-home.html
          if grep -Fqi "MÓDULOS 01 Y 02" /tmp/python-desde-cero-home.html; then
            echo "::error::El dominio todavía está sirviendo la portada anterior."
            exit 1
          fi

          # Verify the production login route actually rendered the configured
          # Turnstile widget; checking only the homepage would miss a broken
          # authentication build.
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors \
            "https://python-desdecero.com/login?release=$GITHUB_SHA" -o /tmp/python-desde-cero-login.html
          if ! grep -Fq 'data-testid="turnstile-widget"' /tmp/python-desde-cero-login.html; then
            echo "::error::La ruta /login no muestra el widget Turnstile después del despliegue."
            exit 1
          fi
          echo "Dominio público sirve la nueva portada y el widget Turnstile en /login."
