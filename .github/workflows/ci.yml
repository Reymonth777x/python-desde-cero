name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  powershell-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate local launcher PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path "scripts/start-local.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell launcher syntax OK"

  test-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fcwbkkivelsipqqrbpya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3IhM0Ck1_EW84Lo8-u9mzg_DRorCBIE
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_PYTHON_RUNNER_ORIGIN: http://127.0.0.1:8788
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare the isolated Python runner assets
        run: npm run prepare:python-runner

      - name: Validate the isolated runner Worker configuration
        run: npx --yes wrangler@4.148.0 deploy --config wrangler.runner.jsonc --dry-run

      - name: Verify every course exercise solution with isolated Python runs
        run: python3 scripts/verify-course-exercises.py

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests contra build de producción
        run: npm run test:e2e

      - name: Build Cloudflare Workers con Vinext
        run: npm run build:vinext

      - name: Auditoría de dependencias (informativa; no bloquea despliegue)
        run: npm audit --audit-level=high
        continue-on-error: true
