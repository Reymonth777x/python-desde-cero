name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fcwbkkivelsipqqrbpya.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3IhM0Ck1_EW84Lo8-u9mzg_DRorCBIE
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests contra build de producción
        run: npm run test:e2e

      - name: Build Cloudflare Workers con Vinext
        run: npm run build:vinext

      - name: Auditoría de dependencias (informativa; no bloquea despliegue)
        run: npm audit --audit-level=high
        continue-on-error: true
